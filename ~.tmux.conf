# Change status bar colors to a sleek dark grey/black
set -g status-style bg=default,fg=white

# Customize the left side of the status bar (Session name)
set -g status-left "#[fg=cyan,bold][#S] #[default]"

# Customize how the window list looks (Clean and spaced)
set -w -g window-status-current-style fg=magenta,bold
set -w -g window-status-current-format " #I:#W* "
set -w -g window-status-format " #I:#W  "

# Customize the right side of the status bar (Date & Time)
set -g status-right "#[fg=yellow,bold]%Y-%m-%d #[fg=green,bold]%H:%M "

# Make the pane border lines clean and subtle
set -g pane-border-style fg=brightblack
set -g pane-active-border-style fg=magenta

# Turn on mouse support (so you can click panes or resize them with the mouse if needed)
set -g mouse on
